<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ltrust 体タイプ診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow phone-like column; Ltrust LP palette (paper, ink, rose, brass) */
:root{
  --paper:#FBF7F3; --paper-2:#F2E8DF; --card:#FFFFFF;
  --ink:#2E2523; --ink-soft:#5A4C47; --line:#DFD0C2;
  --rose:#B0706C; --rose-deep:#8C4F4C; --rose-pale:#F6E7E4; --brass:#A9884F;
  --line-green:#06C755; --chat-bg:#8CABD9; --bubble:#FFFFFF; --bubble-ink:#2E2523; --mine:#9CE47E;
  --serif:"Shippori Mincho B1","Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif;
  --gothic:"Zen Kaku Gothic New","Yu Gothic","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1D1817; --paper-2:#28211F; --card:#2C2523;
  --ink:#F3EAE3; --ink-soft:#C8B8AE; --line:#463A37;
  --rose:#D49A93; --rose-deep:#E7B6AF; --rose-pale:#3A2B29; --brass:#C9A86E;
  --chat-bg:#33415A; --bubble:#3A3331; --bubble-ink:#F3EAE3; --mine:#4F8A3C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1D1817; --paper-2:#28211F; --card:#2C2523;
  --ink:#F3EAE3; --ink-soft:#C8B8AE; --line:#463A37;
  --rose:#D49A93; --rose-deep:#E7B6AF; --rose-pale:#3A2B29; --brass:#C9A86E;
  --chat-bg:#33415A; --bubble:#3A3331; --bubble-ink:#F3EAE3; --mine:#4F8A3C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top img{height:48px;width:auto}
.demo-tag{font-size:11px;letter-spacing:.08em;color:var(--brass);border:1px solid var(--brass);padding:2px 10px;border-radius:999px;white-space:nowrap}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0;line-height:1.45}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--rose);font-weight:500}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;padding:14px 22px;
  background:var(--rose-deep);color:var(--paper);text-align:center;width:100%;font-size:16px;line-height:1.4}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);font-weight:500;font-size:14px;padding:10px 18px;width:auto}
.btn.line{background:var(--line-green);color:#fff}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.9}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,a:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.hero{display:flex;flex-direction:column;gap:14px;padding-block:8px}
.hero h1{font-size:clamp(26px,7vw,34px)}
.hero h1 em{font-style:normal;color:var(--rose-deep)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px}
.meta-row span{font-size:13px;background:var(--paper-2);border-radius:6px;padding:4px 10px;color:var(--ink-soft)}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-soft)}
.gift{display:flex;gap:12px;align-items:center;background:var(--rose-pale);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6}
.gift b{color:var(--rose-deep)}
.gift .tag{flex:none;font-family:var(--serif);font-weight:700;color:var(--paper);background:var(--rose-deep);border-radius:8px;padding:6px 8px;font-size:12px;line-height:1.3;text-align:center}
.note{font-size:12px;color:var(--ink-soft);line-height:1.6}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--rose)}
.qhead{display:flex;flex-direction:column;gap:6px}
.qhead h2{font-size:22px}
.qhead p{font-size:13px;color:var(--ink-soft)}
.group{display:flex;flex-direction:column;gap:8px}
.group h3{font-family:var(--gothic);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:8px 14px;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--rose-deep);border-color:var(--rose-deep);color:var(--paper)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;font:inherit;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;line-height:1.5}
.opt small{display:block;color:var(--ink-soft);font-size:12px}
.opt[aria-pressed="true"]{border-color:var(--rose-deep);box-shadow:inset 0 0 0 1px var(--rose-deep);background:var(--rose-pale)}
.opt .mark{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.opt[aria-pressed="true"] .mark{border:5px solid var(--rose-deep)}
.navrow{display:flex;gap:10px;align-items:center}
.navrow .btn{flex:1}
.result-head{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding-block:8px 4px}
.typeno{font-family:var(--serif);font-size:15px;color:var(--rose)}
.typeno b{font-size:64px;line-height:1;font-weight:700;color:var(--rose-deep);font-variant-numeric:tabular-nums;margin-left:4px}
.result-head h1{font-size:28px}
.result-head .nick{font-size:14px;color:var(--brass);letter-spacing:.06em}
.catch{font-family:var(--serif);font-size:18px;line-height:1.6;border-left:3px solid var(--rose);padding-left:12px}
.body-text{display:flex;flex-direction:column;gap:10px}
.alert{background:var(--rose-pale);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.65}
.mnote{margin:6px 0 0;font-size:13px;color:var(--rose-deep)}
.point-lock{border:1px dashed var(--rose);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.point-lock .q{font-family:var(--serif);font-size:17px}
.point-lock .q span{color:var(--rose-deep);letter-spacing:.2em}
.sec{display:flex;flex-direction:column;gap:12px}
.sec > h3{font-family:var(--gothic);font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--brass)}
.sub-list{display:flex;flex-wrap:wrap;gap:8px}
.sub-list span{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.sub-list b{font-family:var(--serif);color:var(--rose-deep);margin-right:4px}
.menu-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.menu-card .mno{font-size:12px;color:var(--brass);letter-spacing:.08em}
.menu-card .mname{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.4}
.menu-card .mworry{font-size:13px;color:var(--ink-soft)}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price s{color:var(--ink-soft);font-size:14px;font-variant-numeric:tabular-nums}
.price .arrow{color:var(--ink-soft);font-size:13px}
.price strong{font-size:30px;font-family:var(--serif);color:var(--rose-deep);font-variant-numeric:tabular-nums;line-height:1.1}
.price strong small{font-size:15px;margin-left:2px}
.price .lbl{font-size:11px;color:var(--paper);background:var(--rose-deep);border-radius:4px;padding:1px 8px;letter-spacing:.04em;align-self:center}
.price .off{font-size:12px;color:var(--rose-deep);font-weight:700}
.mtime{font-size:13px;color:var(--ink-soft)}
.alt{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.alt .t{font-size:12px;color:var(--brass);font-weight:700;letter-spacing:.06em}
.alt .n{font-family:var(--serif);font-size:16px}
.alt .price strong{font-size:20px}
.cta{display:flex;flex-direction:column;gap:10px}
.phone{background:var(--chat-bg);border-radius:22px;padding:14px 12px 16px;display:flex;flex-direction:column;gap:10px;border:6px solid var(--ink)}
.phone .bar{display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;font-weight:700;padding:0 4px 6px;border-bottom:1px solid rgba(255,255,255,.25)}
.phone .bar i{width:22px;height:22px;border-radius:50%;background:#fff;display:inline-block;flex:none;overflow:hidden}
.phone .bar i img{width:100%;height:100%;object-fit:contain}
.msg{max-width:86%;font-size:13px;line-height:1.6;border-radius:16px;padding:9px 12px;background:var(--bubble);color:var(--bubble-ink)}
.msg.me{align-self:flex-end;background:var(--mine);color:#1d2a16;border-radius:16px 16px 4px 16px}
.msg.bot{align-self:flex-start;border-radius:16px 16px 16px 4px}
.msg.card{padding:0;overflow:hidden;width:86%}
.msg.card .pics{display:grid;grid-template-columns:1fr 1fr}
.msg.card .pics figure{margin:0;position:relative}
.msg.card .pics img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.msg.card .pics figcaption{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;border-radius:4px;padding:1px 6px}
.msg.card .cbody{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.msg.card .cbtn{display:block;text-align:center;background:var(--line-green);color:#fff;font-weight:700;border-radius:8px;padding:8px;font-size:13px}
.msg.card .cbtn.sub{background:transparent;color:var(--bubble-ink);border:1px solid var(--line);font-weight:500}
.msg .ttl{font-weight:700}
.msg .pt{font-weight:700;color:var(--rose-deep)}
.msg s{opacity:.7}
.tiny{font-size:11px;opacity:.75}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.timeline li span{font-size:12px;color:var(--rose-deep);font-weight:700}
.share{display:flex;gap:10px;flex-wrap:wrap}
.share .btn{flex:1;min-width:140px}
.toast{font-size:12px;color:var(--rose-deep);min-height:1em}
.tlist{display:flex;flex-direction:column}
.tlist article{display:grid;grid-template-columns:48px 1fr;gap:12px;border-top:1px solid var(--line);padding:14px 0}
.tlist article > div{min-width:0;display:flex;flex-direction:column;gap:4px}
.tlist .n{font-family:var(--serif);font-size:30px;color:var(--rose-deep);line-height:1;font-variant-numeric:tabular-nums}
.tlist h3{font-size:17px}
.tlist p{font-size:13px;color:var(--ink-soft)}
.tlist .tm{font-size:13px;color:var(--ink)}
.tlist .price strong{font-size:20px}
footer{font-size:11px;color:var(--ink-soft);line-height:1.6;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
footer a{color:var(--rose-deep)}
@media (prefers-reduced-motion:no-preference){.screen{animation:fade .35s ease both}}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>

function compute(s){
  const sc={};const add=(t,v)=>{sc[t]=(sc[t]||0)+v};
  s.picked.forEach(id=>add(ITEM[id].t,1));
  const topT=s.top?ITEM[s.top].t:null;
  if(topT)add(topT,5);
  if(s.life==="senior")add(7,4);
  if(s.q4==="learn")add(12,7);
  (Q5W[s.q5]||[]).forEach(t=>add(t,1));
  let main=FORCE[s.life]||null;
  if(!main){
    const ks=Object.keys(sc).map(Number);
    ks.sort((a,b)=>sc[b]-sc[a]||(b===topT)-(a===topT)||a-b);
    main=ks.length?ks[0]:1;
  }
  let subs=[];
  if(topT&&topT!==main)subs.push(topT);
  [...new Set(s.picked.map(id=>ITEM[id].t))].filter(t=>t!==main&&!subs.includes(t)).sort((a,b)=>sc[b]-sc[a]||a-b).forEach(t=>subs.push(t));
  subs=subs.slice(0,2);
  const alt=main===1?(subs[0]||2):1;
  const notes=[];
  if(s.life==="preg")notes.push("妊娠中の方は、週数や体調をうかがってから内容を決めます。かかりつけの医師・助産師の了承のうえでお越しください。");
  if(s.q6.includes("treat")||s.q6.includes("pain"))notes.push("通院・治療中の方や、強い痛み・しびれがある方は、ご予約の前にLINEで一度ご相談ください。");
  return {main,subs,alt,notes,scores:sc};
}

function priceHTML(m,{label=true}={}){
  if(m.was==null)return '<div class="price"><strong>'+yen(m.price)+'<small>円</small></strong></div>';
  return '<div class="price"><s>通常 '+yen(m.was)+'円</s><span class="arrow">→</span><strong>'+yen(m.price)+'<small>円</small></strong>'+(label?'<span class="lbl">LINEからのご予約・初回</span>':'')+'</div>';
}
function bindNav(back,next){
  const b=document.getElementById("back"),n=document.getElementById("next");

}

   '<div class="sec"><h3>いまのあなたにおすすめ</h3>'+

    '<div class="alt"><p class="t">'+altLabel+'</p><p class="n">'+N(r.alt)+' '+A.name+'<span class="mtime">（'+A.time+'）</span></p>'+priceHTML(A,{label:false})+'</div>'+
   '</div>'+
   '<div class="gift"><span class="tag">LINE<br>特典</span><span>LINEに登録、またはこのまま予約した方に、<b>初回の小顔調整（3,000円相当）</b>をプレゼント</span></div>'+
   '<div class="cta"><button class="btn line" id="lineBtn">LINEで「あなたのポイント」を受け取る<small>「診断'+r.main+'」が入力された状態で開きます</small></button>'+
   '<button class="btn" id="bookBtn">このメニューで予約する<small>LINEの予約画面で、空いている日時を選べます</small></button><p class="toast" id="ctaMsg"></p></div>'+
   '<div class="sec"><h3>LINEで届くもの（イメージ）</h3>'+
    '<div class="phone" aria-label="LINEで届くメッセージのイメージ">'+
     '<div class="bar"><i><img src="'+IMG.logo+'" alt=""></i>美容カイロのお店 Ltrust</div>'+
     '<div class="msg me">診断'+r.main+'</div>'+
     '<div class="msg bot"><span class="ttl">TYPE '+r.main+'｜'+T.name+'</span><br>あなたの体のポイントは<br><span class="pt">「'+T.point+'」</span>です。<br>'+T.pointText+(T.note?'<br><span class="tiny">'+T.note+'</span>':'')+'<br>くわしくは来店時に。またお楽しみに。</div>'+
     '<div class="msg bot card"><div class="pics"><figure><img src="'+IMG.before+'" alt="子育て中、施術を受ける前の髙間さん"><figcaption>以前の髙間</figcaption></figure><figure><img src="'+IMG.now+'" alt="現在の髙間さん"><figcaption>今の髙間</figcaption></figure></div>'+
      '<div class="cbody"><span>実はどちらも私です。体重の差は2〜3kgほど。変わったのは姿勢とむくみでした。</span><span class="tiny">※個人の体験です</span></div></div>'+
     '<div class="msg bot card"><div class="cbody"><span class="ttl">'+N(r.main)+' '+M.name+'</span><span>'+M.time+'｜'+(M.was!=null?'<s>'+yen(M.was)+'円</s> → ':'')+'<b>'+yen(M.price)+'円</b></span><span class="tiny">LINE特典：初回に小顔調整プレゼント</span><span class="cbtn">空き枠を見て予約する</span><span class="cbtn sub">迷ったら '+N(r.alt)+' '+A.name+'</span></div></div>'+
    '</div>'+
    '<h3>そのあともLINEで</h3>'+
    '<ol class="timeline"><li><span>予約したとき</span>日時・店舗・メニュー・料金と、お店の地図</li><li><span>前日の夕方</span>ご予約のリマインド</li><li><span>施術の翌日</span>「よく眠れましたか？つらいところがあれば教えてくださいね」</li><li><span>次回がまだの方</span>2回目以降のご予約はこちらから</li><li><span>月1回</span>体験会・1dayスクールのお知らせ</li></ol>'+
   '</div>'+
   '<div class="sec"><h3>家族や友だちにも</h3><p>全人類が、どこかのタイプにあてはまります。気になる人に送ってみてください。</p><div class="share"><button class="btn ghost" id="copy">リンクをコピー</button><button class="btn ghost" id="again">もう一度診断する</button></div><p class="toast" id="copyMsg"></p></div>'+
  '</section>';
  const msg=document.getElementById("ctaMsg");
  document.getElementById("lineBtn").onclick=()=>{if(CONFIG.lineId){location.href="https://line.me/R/oaMessage/"+encodeURIComponent(CONFIG.lineId)+"/?"+encodeURIComponent("診断"+r.main);return;}msg.textContent="デモではここまでです。本番では、LINEのトーク画面が「診断"+r.main+"」入力済みで開き、送るとポイントが届きます。"};
  document.getElementById("bookBtn").onclick=()=>{if(CONFIG.bookingUrl){location.href=CONFIG.bookingUrl+(CONFIG.bookingUrl.includes("?")?"&":"?")+"menu="+r.main+"&src=diag";return;}msg.textContent="デモではここまでです。本番では、LINEの予約画面が「"+N(r.main)+" "+M.name+"」選択済みで開きます。"};
  document.getElementById("again").onclick=()=>{st=fresh();render();window.scrollTo(0,0)};
  document.getElementById("copy").onclick=()=>{const url=location.href.split("#")[0];const m=document.getElementById("copyMsg");
    try{navigator.clipboard.writeText(url).then(()=>m.textContent="リンクをコピーしました",()=>m.textContent=url)}catch(e){m.textContent=url}};
}
function viewTypes(){
  app.innerHTML='<section class="screen sec"><p class="eyebrow">確認用</p><h1 style="font-size:24px">全14タイプとメニュー・価格</h1><p class="note">どの項目を選ぶとどのタイプになるかと、行き先のメニューの一覧です。価格は「LINEからのご予約・初回」で、通常価格に消し線を引いています。</p>'+
   '<div class="tlist">'+Object.keys(TYPES).map(n=>{n=Number(n);const T=TYPES[n],M=MENUS[n];const keys=[];
     LIFE.forEach(([id,l,,t])=>{if(t===n)keys.push("「"+l+"」");});
     if(n===7)keys.push("「体力・筋力の衰えが気になってきた」");
     if(n===12)keys.push("「自分や家族のケアを学びたい」");
     GROUPS.forEach(g=>g.items.forEach(([id,l,t])=>{if(t===n)keys.push(l)}));
     return '<article><div class="n">'+n+'</div><div><h3>'+N(n)+' '+M.name+'</h3><p>'+T.name+'｜'+T.nick+'</p><p class="tm">'+M.worry+'</p><p class="tm">'+M.time+'</p>'+priceHTML(M,{label:false})+'<p>選ぶとこのタイプに：'+keys.join("、")+'</p></div></article>'}).join("")+'</div>'+
   '<button class="btn" id="back2">診断のはじめに戻る</button></section>';
  document.getElementById("back2").onclick=()=>{history.replaceState(null,"",location.pathname+location.search);st=fresh();render();window.scrollTo(0,0)};
}
function render(){
  if(location.hash==="#types"){viewTypes();return}
  const s=st.step;
  if(s===0)viewStart();
  else if(s===1){single(1,"いまのあなたに近いのは？","ご自身のことでも、ご家族のための診断でも大丈夫です。",LIFE.map(([v,l,sub])=>[v,l,sub]),"life");bindNav(()=>{st.step=0},()=>{st.step=2})}
  else if(s===2)viewQ2();
  else if(s===3){single(3,"その中で、いちばん叶えたいのは？","選んだ項目から1つ選んでください。",st.picked.map(id=>[id,ITEM[id].label]),"top");bindNav(()=>{st.step=2},()=>{st.step=4})}
  else if(s===4){single(4,"どうなりたいですか？","",Q4,"q4");bindNav(()=>{st.step=3},()=>{st.step=5})}
  else if(s===5){single(5,"ふだんの過ごし方に近いのは？","お仕事や家事の時間を思い浮かべてください。",Q5,"q5");bindNav(()=>{st.step=4},()=>{st.step=6})}
  else if(s===6)viewQ6();
  else viewResult();
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
if(typeof module!=="undefined")module.exports={compute,MENUS,TYPES,GROUPS,LIFE,ITEM};
else render();
</script>
